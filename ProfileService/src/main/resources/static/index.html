<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodNutri Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { color-scheme: dark; --green:#22c55e; --green-dark:#16a34a; --bg:#0f172a; --surface:#1e293b; --border:#334155; --text:#f1f5f9; --muted:#94a3b8; --red:#f87171; }
    body { margin:0; min-height:100vh; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
    header { padding:1rem 2rem; border-bottom:1px solid var(--border); }
    .logo { color:var(--green); font-size:1.4rem; font-weight:700; }
    main { max-width:520px; margin:0 auto; padding:5rem 1.5rem; }
    .card { padding:2rem; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
    h1 { margin:0 0 .75rem; }
    p { color:var(--muted); line-height:1.6; }
    .actions { display:flex; flex-wrap:wrap; gap:.75rem; margin-top:1.5rem; }
    [hidden] { display:none !important; }
    button { padding:.7rem 1.2rem; border:0; border-radius:8px; background:var(--green); color:white; font:inherit; font-weight:650; cursor:pointer; }
    button:hover { background:var(--green-dark); }
    button.secondary { background:transparent; border:1px solid var(--border); color:var(--text); }
    button.secondary:hover { background:var(--bg); }
    .message { display:none; margin-top:1.25rem; padding:.8rem 1rem; border-radius:8px; }
    .message.error { display:block; color:var(--red); border:1px solid #7f1d1d; background:#450a0a55; }
    .message.success { display:block; color:#86efac; border:1px solid #166534; background:#052e1655; }
    code { color:#86efac; }
  </style>
</head>
<body>
<header><span class="logo">FoodNutri</span></header>
<main>
  <section class="card">
    <h1 id="title">Anmelden</h1>
    <p id="intro">Die Anmeldung und Benutzerverwaltung wird sicher von Keycloak übernommen.</p>
    <div class="actions" id="loggedOutActions">
      <button id="loginButton" type="button">Mit Keycloak anmelden</button>
      <button id="registerButton" class="secondary" type="button">Konto erstellen</button>
    </div>
    <div class="actions" id="loggedInActions" hidden>
      <button id="openButton" type="button">FoodNutri öffnen</button>
      <button id="logoutButton" class="secondary" type="button">Abmelden</button>
    </div>
    <div id="message" class="message"></div>
  </section>
</main>
<script>
  const AUTH = {
    issuer: 'http://localhost:8090/realms/foodnutri',
    clientId: 'foodnutri-web',
    redirectUri: `${window.location.origin}/login`,
    tokenKey: 'foodnutriProfileToken',
    refreshTokenKey: 'foodnutriRefreshToken',
    idTokenKey: 'foodnutriIdToken',
    expiresAtKey: 'foodnutriTokenExpiresAt',
    verifierKey: 'foodnutriPkceVerifier',
    stateKey: 'foodnutriOauthState'
  };

  const message = document.getElementById('message');
  const loggedOutActions = document.getElementById('loggedOutActions');
  const loggedInActions = document.getElementById('loggedInActions');

  function randomBase64Url(byteLength = 48) {
    const bytes = crypto.getRandomValues(new Uint8Array(byteLength));
    return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  async function sha256Base64Url(value) {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
    return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function showMessage(type, text) {
    message.className = `message ${type}`;
    message.textContent = text;
  }

  function clearTokens() {
    [AUTH.tokenKey, AUTH.refreshTokenKey, AUTH.idTokenKey, AUTH.expiresAtKey].forEach(key => sessionStorage.removeItem(key));
  }

  function decodeJwt(token) {
    try {
      const payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(escape(atob(payload))));
    } catch {
      return {};
    }
  }

  function renderSession() {
    const token = sessionStorage.getItem(AUTH.tokenKey);
    const claims = token ? decodeJwt(token) : {};
    const loggedIn = Boolean(token && claims.exp * 1000 > Date.now());
    loggedOutActions.hidden = loggedIn;
    loggedInActions.hidden = !loggedIn;
    if (loggedIn) {
      document.getElementById('title').textContent = `Hallo ${claims.preferred_username || ''}`.trim();
      document.getElementById('intro').textContent = 'Du bist über Keycloak angemeldet. Dein Access Token wird von jedem Microservice unabhängig geprüft.';
    }
  }

  async function refreshAccessToken() {
    const refreshToken = sessionStorage.getItem(AUTH.refreshTokenKey);
    if (!refreshToken) return false;

    const response = await fetch(`${AUTH.issuer}/protocol/openid-connect/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'refresh_token',
        client_id: AUTH.clientId,
        refresh_token: refreshToken
      })
    });
    if (!response.ok) return false;

    const tokens = await response.json();
    sessionStorage.setItem(AUTH.tokenKey, tokens.access_token);
    if (tokens.refresh_token) sessionStorage.setItem(AUTH.refreshTokenKey, tokens.refresh_token);
    if (tokens.id_token) sessionStorage.setItem(AUTH.idTokenKey, tokens.id_token);
    sessionStorage.setItem(AUTH.expiresAtKey, String(Date.now() + tokens.expires_in * 1000));
    return true;
  }

  async function openFoodNutri() {
    const token = sessionStorage.getItem(AUTH.tokenKey);
    const claims = token ? decodeJwt(token) : {};
    const tokenIsValid = Boolean(token && claims.exp * 1000 > Date.now() + 30_000);
    if (tokenIsValid || await refreshAccessToken().catch(() => false)) {
      window.location.assign('/food');
      return;
    }

    clearTokens();
    renderSession();
    showMessage('error', 'Deine Keycloak-Sitzung ist abgelaufen. Bitte melde dich erneut an.');
  }

  async function startAuthorization(registration = false) {
    const verifier = randomBase64Url();
    const state = randomBase64Url(24);
    sessionStorage.setItem(AUTH.verifierKey, verifier);
    sessionStorage.setItem(AUTH.stateKey, state);

    const params = new URLSearchParams({
      client_id: AUTH.clientId,
      redirect_uri: AUTH.redirectUri,
      response_type: 'code',
      scope: 'openid profile email',
      state,
      code_challenge: await sha256Base64Url(verifier),
      code_challenge_method: 'S256'
    });
    const endpoint = registration ? 'registrations' : 'auth';
    window.location.assign(`${AUTH.issuer}/protocol/openid-connect/${endpoint}?${params}`);
  }

  async function finishAuthorization(code, state) {
    const expectedState = sessionStorage.getItem(AUTH.stateKey);
    const verifier = sessionStorage.getItem(AUTH.verifierKey);
    sessionStorage.removeItem(AUTH.stateKey);
    sessionStorage.removeItem(AUTH.verifierKey);
    if (!expectedState || state !== expectedState || !verifier) {
      throw new Error('Die Login-Antwort konnte nicht sicher zugeordnet werden. Bitte erneut anmelden.');
    }

    const body = new URLSearchParams({
      grant_type: 'authorization_code',
      client_id: AUTH.clientId,
      redirect_uri: AUTH.redirectUri,
      code,
      code_verifier: verifier
    });
    const response = await fetch(`${AUTH.issuer}/protocol/openid-connect/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    if (!response.ok) throw new Error('Keycloak konnte den Anmeldecode nicht in ein Token tauschen.');
    const tokens = await response.json();
    sessionStorage.setItem(AUTH.tokenKey, tokens.access_token);
    sessionStorage.setItem(AUTH.refreshTokenKey, tokens.refresh_token);
    sessionStorage.setItem(AUTH.idTokenKey, tokens.id_token);
    sessionStorage.setItem(AUTH.expiresAtKey, String(Date.now() + tokens.expires_in * 1000));
    window.history.replaceState({}, document.title, '/login');
    window.location.replace('/food');
  }

  function logout() {
    const idToken = sessionStorage.getItem(AUTH.idTokenKey);
    clearTokens();
    const params = new URLSearchParams({ client_id: AUTH.clientId, post_logout_redirect_uri: AUTH.redirectUri });
    if (idToken) params.set('id_token_hint', idToken);
    window.location.assign(`${AUTH.issuer}/protocol/openid-connect/logout?${params}`);
  }

  document.getElementById('loginButton').addEventListener('click', () => startAuthorization(false));
  document.getElementById('registerButton').addEventListener('click', () => startAuthorization(true));
  document.getElementById('openButton').addEventListener('click', openFoodNutri);
  document.getElementById('logoutButton').addEventListener('click', logout);

  const query = new URLSearchParams(window.location.search);
  if (query.get('logout') === '1') {
    logout();
  } else if (query.has('error')) {
    showMessage('error', query.get('error_description') || 'Die Anmeldung wurde abgebrochen.');
    window.history.replaceState({}, document.title, '/login');
  } else if (query.has('code')) {
    finishAuthorization(query.get('code'), query.get('state')).catch(error => {
      clearTokens();
      showMessage('error', error.message);
    });
  } else {
    renderSession();
  }
</script>
</body>
</html>
