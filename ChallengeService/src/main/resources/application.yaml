spring:
  application:
    name: ChallengeService
  datasource:
    url: jdbc:h2:mem:challengedb
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

server:
  port: 8081

food:
  service:
    url: http://localhost:8080
