server.port=8080
spring.application.name=TEST-SERVICE
spring.datasource.url=jdbc:h2:mem:fooddb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
profile.service.url=${PROFILE_SERVICE_URL:http://localhost:8082}
openfoodfacts.user-agent=${OPENFOODFACTS_USER_AGENT:FoodNutriApp/1.0}
